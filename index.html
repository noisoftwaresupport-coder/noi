<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noi</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #1a1a1a;
      --muted: #555;
      --bg: #fff;
      --link: #0b57d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e8e8e8;
        --muted: #aaa;
        --bg: #121212;
        --link: #8ab4f8;
      }
    }
    body {
      margin: 0;
      padding: 2rem 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 42rem;
      margin-inline: auto;
    }
    h1 { font-size: 1.5rem; margin-top: 0; }
    p { color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <h1>Noi</h1>
  <p>Language-learning application for Android.</p>
  <p><a href="privacy/">Privacy Policy</a></p>
  <p><a href="delete-account/">Delete account and data</a></p>
</body>
</html>
